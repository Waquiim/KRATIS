<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
<title>Painel Contábil · Viçosa/MG</title>
<meta name="theme-color" content="#B11E25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel Viçosa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css">
<style>
  html, body { margin: 0; background: #fff; }
  #pv-carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #262626; background: #fff; z-index: 10; padding: 24px;
    text-align: center; }
  #pv-carregando img { width: min(320px, 70vw); height: auto; }
  #pv-carregando .barra { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #F1ECE6; overflow: hidden; }
  #pv-carregando .barra div { height: 100%; width: 40%; background: #B11E25; border-radius: 3px; animation: pv 1.2s ease-in-out infinite; }
  #pv-carregando small { color: #6b6b6b; max-width: 420px; line-height: 1.4; }
  @keyframes pv { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
<div id="pv-carregando">
  <img src="assets.logo_vicosa.jpg" alt="Prefeitura de Viçosa">
  <b>Painel Contábil e Fiscal</b>
  <div class="barra"><div></div></div>
  <small id="pv-msg">Preparando o painel neste aparelho… No primeiro acesso o carregamento leva cerca de 1 minuto;
  nos seguintes é mais rápido e funciona até sem internet.</small>
</div>
<div id="root"></div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";

const arquivos = {
 "app.py": "app.py",
 "painel/__init__.py": "painel.init__.py",
 "painel/atualizar.py": "painel.atualizar.py",
 "painel/config.py": "painel.config.py",
 "painel/consistencia.py": "painel.consistencia.py",
 "painel/criticas.py": "painel.criticas.py",
 "painel/dados.py": "painel.dados.py",
 "painel/estado.py": "painel.estado.py",
 "painel/fontes/__init__.py": "painel.fontes.init__.py",
 "painel/fontes/tce_sicom.py": "painel.fontes.tce_sicom.py",
 "painel/formatos.py": "painel.formatos.py",
 "painel/indicadores.py": "painel.indicadores.py",
 "painel/ui/__init__.py": "painel.ui.init__.py",
 "painel/ui/comum.py": "painel.ui.comum.py",
 "painel/ui/navegacao.py": "painel.ui.navegacao.py",
 "painel/ui/paginas/__init__.py": "painel.ui.paginas.init__.py",
 "painel/ui/paginas/atualizacao.py": "painel.ui.paginas.atualizacao.py",
 "painel/ui/paginas/comparativo.py": "painel.ui.paginas.comparativo.py",
 "painel/ui/paginas/consistencia.py": "painel.ui.paginas.consistencia.py",
 "painel/ui/paginas/contratos.py": "painel.ui.paginas.contratos.py",
 "painel/ui/paginas/criticas.py": "painel.ui.paginas.criticas.py",
 "painel/ui/paginas/despesas.py": "painel.ui.paginas.despesas.py",
 "painel/ui/paginas/educacao.py": "painel.ui.paginas.educacao.py",
 "painel/ui/paginas/empenhos.py": "painel.ui.paginas.empenhos.py",
 "painel/ui/paginas/licitacoes.py": "painel.ui.paginas.licitacoes.py",
 "painel/ui/paginas/orgaos.py": "painel.ui.paginas.orgaos.py",
 "painel/ui/paginas/pessoal.py": "painel.ui.paginas.pessoal.py",
 "painel/ui/paginas/receitas.py": "painel.ui.paginas.receitas.py",
 "painel/ui/paginas/saude.py": "painel.ui.paginas.saude.py",
 "painel/ui/paginas/veiculos.py": "painel.ui.paginas.veiculos.py",
 "painel/ui/paginas/visao_geral.py": "painel.ui.paginas.visao_geral.py",
 "assets/logo_vicosa.jpg": "assets.logo_vicosa.jpg",
 "ferramentas/favorito_sicom_vicosa.js": "ferramentas.favorito_sicom_vicosa.js",
 "parametros_padrao.json": "parametros_padrao.json",
 "pacote_sicom/SICOM.2024.3171303.contrato.zip": "pacote_sicom.SICOM.2024.3171303.contrato.zip",
 "pacote_sicom/SICOM.2024.3171303.desp_pessoal.zip": "pacote_sicom.SICOM.2024.3171303.desp_pessoal.zip",
 "pacote_sicom/SICOM.2024.3171303.despesa.zip": "pacote_sicom.SICOM.2024.3171303.despesa.zip",
 "pacote_sicom/SICOM.2024.3171303.educacao.zip": "pacote_sicom.SICOM.2024.3171303.educacao.zip",
 "pacote_sicom/SICOM.2024.3171303.empenho.zip": "pacote_sicom.SICOM.2024.3171303.empenho.zip",
 "pacote_sicom/SICOM.2024.3171303.frota.zip": "pacote_sicom.SICOM.2024.3171303.frota.zip",
 "pacote_sicom/SICOM.2024.3171303.licitacao.zip": "pacote_sicom.SICOM.2024.3171303.licitacao.zip",
 "pacote_sicom/SICOM.2024.3171303.orgao.zip": "pacote_sicom.SICOM.2024.3171303.orgao.zip",
 "pacote_sicom/SICOM.2024.3171303.receita.zip": "pacote_sicom.SICOM.2024.3171303.receita.zip",
 "pacote_sicom/SICOM.2024.3171303.saude.zip": "pacote_sicom.SICOM.2024.3171303.saude.zip",
 "pacote_sicom/SICOM.2025.3171303.contrato.zip": "pacote_sicom.SICOM.2025.3171303.contrato.zip",
 "pacote_sicom/SICOM.2025.3171303.desp_pessoal.zip": "pacote_sicom.SICOM.2025.3171303.desp_pessoal.zip",
 "pacote_sicom/SICOM.2025.3171303.despesa.zip": "pacote_sicom.SICOM.2025.3171303.despesa.zip",
 "pacote_sicom/SICOM.2025.3171303.educacao.zip": "pacote_sicom.SICOM.2025.3171303.educacao.zip",
 "pacote_sicom/SICOM.2025.3171303.empenho.zip": "pacote_sicom.SICOM.2025.3171303.empenho.zip",
 "pacote_sicom/SICOM.2025.3171303.frota.zip": "pacote_sicom.SICOM.2025.3171303.frota.zip",
 "pacote_sicom/SICOM.2025.3171303.licitacao.zip": "pacote_sicom.SICOM.2025.3171303.licitacao.zip",
 "pacote_sicom/SICOM.2025.3171303.orgao.zip": "pacote_sicom.SICOM.2025.3171303.orgao.zip",
 "pacote_sicom/SICOM.2025.3171303.receita.zip": "pacote_sicom.SICOM.2025.3171303.receita.zip",
 "pacote_sicom/SICOM.2025.3171303.saude.zip": "pacote_sicom.SICOM.2025.3171303.saude.zip",
 "pacote_sicom/SICOM.2026.3171303.contrato.zip": "pacote_sicom.SICOM.2026.3171303.contrato.zip",
 "pacote_sicom/SICOM.2026.3171303.desp_pessoal.zip": "pacote_sicom.SICOM.2026.3171303.desp_pessoal.zip",
 "pacote_sicom/SICOM.2026.3171303.despesa.zip": "pacote_sicom.SICOM.2026.3171303.despesa.zip",
 "pacote_sicom/SICOM.2026.3171303.educacao.zip": "pacote_sicom.SICOM.2026.3171303.educacao.zip",
 "pacote_sicom/SICOM.2026.3171303.empenho.zip": "pacote_sicom.SICOM.2026.3171303.empenho.zip",
 "pacote_sicom/SICOM.2026.3171303.frota.zip": "pacote_sicom.SICOM.2026.3171303.frota.zip",
 "pacote_sicom/SICOM.2026.3171303.licitacao.zip": "pacote_sicom.SICOM.2026.3171303.licitacao.zip",
 "pacote_sicom/SICOM.2026.3171303.orgao.zip": "pacote_sicom.SICOM.2026.3171303.orgao.zip",
 "pacote_sicom/SICOM.2026.3171303.receita.zip": "pacote_sicom.SICOM.2026.3171303.receita.zip",
 "pacote_sicom/SICOM.2026.3171303.saude.zip": "pacote_sicom.SICOM.2026.3171303.saude.zip",
 "pacote_sicom/manifesto.json": "pacote_sicom.manifesto.json"
};
// Endereço da pasta do painel (ex.: /KRATIS/ no GitHub Pages), mesmo quando a página é aberta pelo endereço de
// uma aba (/KRATIS/atualizacao): tira do fim do caminho os nomes das abas.
const ABAS = ["visao-geral", "receitas", "despesas", "empenho", "pessoal", "saude", "educacao", "licitacao", "contratos", "veiculos", "orgao", "comparativo", "criticas", "consistencia", "atualizacao"];
const partes = location.pathname.split("/");
while (partes.length > 1 && (partes[partes.length - 1] === "" || ABAS.includes(partes[partes.length - 1]))) partes.pop();
const base = partes.join("/") + "/";
const files = {};
// URLs absolutas: o Python roda num Web Worker, que não resolve endereços relativos à página.
// "?v=" muda a cada geração, para o navegador nunca usar arquivos de uma versão anterior.
for (const [caminho, url] of Object.entries(arquivos)) files[caminho] = { url: new URL(url + "?v=20261029-0907-86b7bf33", location.origin + base).href };
// O tema vai dentro desta página, e não como arquivo à parte, para a publicação depender de um arquivo a menos.
files[".streamlit/config.toml"] = { data: "# Identidade visual da Prefeitura de Viçosa (cores extraídas da logo oficial)\n[theme]\nbase = \"light\"\nprimaryColor = \"#B11E25\"\nbackgroundColor = \"#FFFFFF\"\nsecondaryBackgroundColor = \"#F6F3EF\"\ntextColor = \"#262626\"\nlinkColor = \"#1F5FAE\"\nborderColor = \"#E4DED6\"\nfont = \"sans serif\"\nbaseRadius = \"0.5rem\"\nredColor = \"#B11E25\"\nblueColor = \"#1F5FAE\"\nyellowColor = \"#A67C00\"\nchartCategoricalColors = [\"#B11E25\", \"#1F5FAE\", \"#A67C00\", \"#1baf7a\", \"#6250d6\", \"#e87ba4\", \"#008300\", \"#eb6834\"]\n\n[theme.sidebar]\nbackgroundColor = \"#FBF8F4\"\nsecondaryBackgroundColor = \"#F1ECE6\"\n\n[server]\nheadless = true\nrunOnSave = false\n# Só aceita conexões deste computador. Para compartilhar na rede interna, use: --server.address 0.0.0.0\naddress = \"localhost\"\nfileWatcherType = \"none\"\n\n[browser]\ngatherUsageStats = false\n\n[client]\ntoolbarMode = \"minimal\"\n" };

// O stlite usa o endereço atual como base das abas; aberto em /KRATIS/atualizacao, ele repetiria o nome da aba
// (/KRATIS/atualizacao/receitas). Monta com o endereço da pasta e devolve o endereço da aba em seguida.
const enderecoAberto = location.pathname + location.search + location.hash;
history.replaceState(history.state, "", base + location.search + location.hash);
mount({
  requirements: ["plotly", "openpyxl"],
  entrypoint: "app.py",
  files,
  idbfsMountpoints: ["/mnt"],  // armazenamento permanente do navegador (o painel usa /mnt/painel)
  streamlitConfig: { "client.toolbarMode": "minimal", "browser.gatherUsageStats": false },
}, document.getElementById("root"));
history.replaceState(history.state, "", enderecoAberto);

// Esconde a tela de abertura quando o painel desenhar a primeira página. Se a carga inicial falhar
// (ex.: oscilação de rede), recarrega uma vez sozinho antes de mostrar o erro.
const fim = setInterval(() => {
  const falhou = document.querySelector(".Toastify__toast--error");
  if (falhou && !sessionStorage.getItem("pv-recarregou")) {
    sessionStorage.setItem("pv-recarregou", "1");
    location.reload();
    return;
  }
  if (falhou || document.querySelector('.pv-cabecalho, [data-testid="stException"]')) {
    if (!falhou) sessionStorage.removeItem("pv-recarregou");
    document.getElementById("pv-carregando").remove();
    clearInterval(fim);
  }
}, 300);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register(base + "sw.js").catch((erro) => console.warn("Modo offline indisponível:", erro));
}
</script>
</body>
</html>
